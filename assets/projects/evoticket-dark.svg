<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="title desc">
  <title id="title">EvoTicket — conceptual ticketing system map</title><desc id="desc">A simplified system sketch connecting client, API, ordering and payment, with Redis and PostgreSQL. Focus: holds, idempotency and asynchronous flows. This is not a deployment diagram.</desc>
  <!-- NLHP / Swiss Technical Editorial. Grid: 1200 / margin 48 / column step 92 / baseline 12. -->
  <style>
    .canvas{fill:#101713} .surface{fill:#18211C} .ink{fill:#F1F4EE} .muted{fill:#A7B2AA} .accent{fill:#A7D46F}
    .rule{stroke:#2F3C34;stroke-width:1;fill:none} .signal{stroke:#A7D46F;stroke-width:3;fill:none}
    .sans{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}
  </style>

  <rect width="1200" height="456" class="canvas"/>
  <g letter-spacing="1.2">
    <text x="48" y="48" class="mono muted" font-size="14" >PROJECT / 001</text>
    <text x="1152" y="48" class="mono muted" font-size="14" text-anchor="end">EVOTICKET / 2026</text>
  </g>
  <path d="M48 72H1152 M48 396H1152" class="rule"/>
  <text x="48" y="132" class="sans ink" font-size="48" font-weight="700" letter-spacing="-1.2">EVOTICKET</text>
  <text x="1152" y="120" class="mono muted" font-size="14" text-anchor="end" letter-spacing="1.2">CONCEPTUAL SYSTEM MAP</text>
  <path d="M232 216H324 M508 216H600 M784 216H876 M692 252V288H508V312 M1014 252V312" class="rule"/>
  <path d="M560 216H588" class="signal"/>
  <rect x="48" y="180" width="184" height="72" class="surface"/><rect x="48.5" y="180.5" width="183" height="71" class="rule"/><text x="72" y="211" class="mono ink" font-size="16" >CLIENT</text><text x="72" y="235" class="mono muted" font-size="12" >Product interface</text>
  <rect x="324" y="180" width="184" height="72" class="surface"/><rect x="324.5" y="180.5" width="183" height="71" class="rule"/><text x="348" y="211" class="mono ink" font-size="16" >API</text><text x="348" y="235" class="mono muted" font-size="12" >System boundary</text>
  <rect x="600" y="180" width="184" height="72" class="surface"/><rect x="600.5" y="180.5" width="183" height="71" class="rule"/><text x="624" y="211" class="mono ink" font-size="16" >ORDERING</text><text x="624" y="235" class="mono muted" font-size="12" >Ticket reservations</text>
  <rect x="876" y="180" width="276" height="72" class="surface"/><rect x="876.5" y="180.5" width="275" height="71" class="rule"/><text x="900" y="211" class="mono ink" font-size="16" >PAYMENT</text><text x="900" y="235" class="mono muted" font-size="12" >Idempotent handling</text>
  <rect x="416" y="312" width="184" height="48" class="surface"/>
  <rect x="416.5" y="312.5" width="183" height="47" class="rule"/>
  <text x="440" y="342" class="mono ink" font-size="14" >REDIS</text>
  <rect x="876" y="312" width="276" height="48" class="surface"/>
  <rect x="876.5" y="312.5" width="275" height="47" class="rule"/>
  <text x="900" y="342" class="mono ink" font-size="14" >POSTGRESQL</text>
  <text x="48" y="336" class="mono muted" font-size="12" letter-spacing="1.2">SYSTEM SKETCH</text>
  <g letter-spacing="1.2">
    <text x="48" y="432" class="mono ink" font-size="14" >01 / HOLDS</text>
    <text x="416" y="432" class="mono ink" font-size="14" >02 / IDEMPOTENCY</text>
    <text x="784" y="432" class="mono ink" font-size="14" >03 / ASYNC FLOWS</text>
  </g>
</svg>
